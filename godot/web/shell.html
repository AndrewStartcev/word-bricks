<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>$GODOT_PROJECT_NAME</title>
  $GODOT_HEAD_INCLUDE
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06142f;
      font-family: Arial, Helvetica, sans-serif;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      background: #06142f;
    }

    #boot {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff5d2;
      background:
        radial-gradient(circle at 82% 16%, rgba(255,226,150,.24) 0 5%, transparent 13%),
        radial-gradient(circle at 50% 16%, rgba(43,111,255,.14), transparent 33%),
        linear-gradient(180deg, #071d4c 0%, #08285b 45%, #06142f 100%);
      transition: opacity .18s ease;
    }

    #boot::before,
    #boot::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #boot::before {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.82) 0 1px, transparent 1.4px),
        radial-gradient(circle, rgba(92,164,255,.75) 0 1px, transparent 1.5px);
      background-size: 96px 96px, 137px 137px;
      background-position: 18px 22px, 62px 15px;
      opacity: .34;
    }

    #boot::after {
      background: linear-gradient(180deg, transparent 62%, rgba(0,8,24,.44));
    }

    .boot-card {
      position: relative;
      z-index: 2;
      width: min(760px, 82vw);
      text-align: center;
      transform: translateY(-2vh);
    }

    .brand {
      margin: 0 auto 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 6.2vw, 92px);
      font-weight: 800;
      line-height: .95;
      letter-spacing: .02em;
      color: #ffd76a;
      text-shadow:
        0 3px 0 #8f4c14,
        0 6px 18px rgba(0,0,0,.62),
        0 0 30px rgba(54,142,255,.26);
    }

    .subtitle {
      display: inline-block;
      margin-bottom: clamp(56px, 8vh, 92px);
      padding: 7px 30px 9px;
      border: 2px solid rgba(225,164,54,.84);
      border-radius: 999px;
      background: rgba(45,21,7,.72);
      color: #ffe9a8;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 2.1vw, 27px);
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
    }

    .bar-shell {
      position: relative;
      width: min(720px, 76vw);
      height: 34px;
      margin: 0 auto;
      padding: 5px;
      box-sizing: border-box;
      border: 3px solid #d99a2d;
      border-radius: 999px;
      background: #281708;
      box-shadow:
        inset 0 0 0 2px #6f3f11,
        0 8px 24px rgba(0,0,0,.38),
        0 0 24px rgba(43,132,255,.18);
    }

    #bar {
      height: 100%;
      width: 7%;
      border-radius: 999px;
      background: linear-gradient(180deg, #42f37c, #079c3f 62%, #036e2b);
      box-shadow: inset 0 2px 5px rgba(255,255,255,.52), 0 0 16px rgba(49,239,115,.42);
      transition: width .12s linear;
    }

    .caption {
      margin-top: 22px;
      font-size: clamp(15px, 1.8vw, 22px);
      color: #f5e6b6;
      text-shadow: 0 2px 6px rgba(0,0,0,.65);
    }

    #boot.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>

  <div id="boot" aria-label="Загрузка игры">
    <div class="boot-card">
      <div class="brand">СЛОВОПАД</div>
      <div class="subtitle">Магия слов</div>
      <div class="bar-shell"><div id="bar"></div></div>
      <div class="caption">Магия слов пробуждается…</div>
    </div>
  </div>

  <script src="$GODOT_URL"></script>
  <script>
    (() => {
      const boot = document.getElementById('boot');
      const bar = document.getElementById('bar');
      const canvas = document.getElementById('canvas');
      const config = $GODOT_CONFIG;

      config.canvas = canvas;
      config.onProgress = (current, total) => {
        if (!bar || !total || total <= 0) return;
        const percent = Math.max(7, Math.min(96, (current / total) * 100));
        bar.style.width = percent.toFixed(1) + '%';
      };

      const engine = new Engine(config);
      engine.startGame().then(() => {
        if (bar) bar.style.width = '100%';
        requestAnimationFrame(() => {
          boot.classList.add('hidden');
          setTimeout(() => boot.remove(), 220);
          canvas.focus({ preventScroll: true });
        });
      }).catch((error) => {
        console.error('Godot Web start failed:', error);
        const caption = document.querySelector('.caption');
        if (caption) caption.textContent = 'Не удалось запустить игру. Обновите страницу.';
      });
    })();
  </script>
</body>
</html>
