name: Final release cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-release-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove final unused UI preload and archive asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('godot/scripts/app_runtime_ui_final.gd')
          text=p.read_text(encoding='utf-8')
          text=text.replace('\nconst FINAL_ICON_RESET: Texture2D = preload("res://assets/ui/icons/icon_reset.svg")\n','\n')
          p.write_text(text, encoding='utf-8')
          PY
          mkdir -p unused_assets/assets/ui/icons
          git mv godot/assets/ui/icons/icon_reset.svg unused_assets/assets/ui/icons/icon_reset.svg
      - name: Remove one-off maintenance workflows
        shell: bash
        run: |
          git rm -f .github/workflows/audit-semantic-assets.yml || true
          git rm -f .github/workflows/cleanup-unused-assets.yml || true
          git rm -f .github/workflows/lazy-load-comics.yml || true
          git rm -f .github/workflows/final-release-cleanup.yml || true
      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: finalize clean Godot project"
          git push origin HEAD:main
