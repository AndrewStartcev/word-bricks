name: Lazy-load comic textures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lazy-load-comics.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Convert comic preloads to on-demand loads
        run: python tools/lazy_load_comics.py
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/scripts/app_runtime_story.gd godot/scripts/app_runtime_chapters.gd godot/scripts/app_runtime_full.gd
          git commit -m "perf: lazy-load narrative textures on Web"
          git push origin HEAD:main
