name: Optimize release assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/optimize_release_assets.py'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize visual assets
        run: python tools/optimize_release_assets.py
      - name: Commit optimized assets
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/assets godot/scripts godot/scenes godot/docs
          git commit -m "assets: optimize release visuals"
          git push origin HEAD:main
