name: Audit semantic asset usage

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-semantic-assets.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Analyze preload symbols and SFX events
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root=Path('godot')
          texts={p:p.read_text(encoding='utf-8') for p in root.rglob('*.gd')}
          joined='\n'.join(texts.values())
          const_re=re.compile(r'const\s+([A-Z0-9_]+)[^\n=]*=\s*preload\("(res://assets/[^\"]+)"\)')
          print('=== PRELOAD CONSTANTS USED ONLY AT DECLARATION ===')
          for p,t in texts.items():
              for name,asset in const_re.findall(t):
                  count=sum(len(re.findall(r'\b'+re.escape(name)+r'\b',x)) for x in texts.values())
                  if count <= 1:
                      print(name, asset, 'count=',count, 'decl=',p)
          audio=Path('godot/scripts/audio_service.gd').read_text(encoding='utf-8')
          sfx=dict(re.findall(r'"([a-z_]+)"\s*:\s*preload\("(res://assets/audio/sfx/[^\"]+)"\)', audio))
          other='\n'.join(t for p,t in texts.items() if p.as_posix()!='godot/scripts/audio_service.gd')
          print('=== SFX WITH NO EVENT ID OUTSIDE AUDIO SERVICE ===')
          for key,asset in sfx.items():
              if not re.search(r'["\']'+re.escape(key)+r'["\']', other):
                  print(key, asset)
          PY
