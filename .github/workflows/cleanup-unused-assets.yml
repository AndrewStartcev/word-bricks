name: Cleanup unused Godot assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-unused-assets.yml'
      - 'tools/cleanup_unused_assets.py'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Move unreachable media out of Godot project
        run: python tools/cleanup_unused_assets.py
      - name: Force robust all-resources export preset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('godot/export_presets.cfg')
          text = p.read_text(encoding='utf-8')
          text = text.replace('export_filter="scenes"', 'export_filter="all_resources"')
          text = text.replace('export_files=PackedStringArray("res://main.tscn")', 'export_files=PackedStringArray()')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: move unused media out of Godot project"
          git push origin HEAD:main
