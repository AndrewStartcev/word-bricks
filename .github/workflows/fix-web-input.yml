name: Fix Web Input
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-web-input.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch loading overlay
        run: python -c "from pathlib import Path; p=Path('godot/scripts/app_runtime_ui.gd'); t=p.read_text(encoding='utf-8'); old='\tif boot_overlay != null and is_instance_valid(boot_overlay):\n\t\tvar fade: Tween = create_tween()\n\t\tfade.tween_property(boot_overlay, \"modulate:a\", 0.0, 0.18)\n\t\tfade.tween_callback(boot_overlay.queue_free)\n'; new='\tif boot_overlay != null and is_instance_valid(boot_overlay):\n\t\tboot_overlay.mouse_filter = Control.MOUSE_FILTER_IGNORE\n\t\tboot_overlay.mouse_behavior_recursive = Control.MOUSE_BEHAVIOR_DISABLED\n\t\tvar fade: Tween = create_tween()\n\t\tfade.tween_property(boot_overlay, \"modulate:a\", 0.0, 0.18)\n\t\tfade.tween_callback(boot_overlay.queue_free)\n'; assert old in t; p.write_text(t.replace(old,new,1),encoding='utf-8')"
      - name: Commit
        run: |
          rm -f .github/workflows/fix-web-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop loading overlay blocking Web menu"
          git push origin HEAD:main
